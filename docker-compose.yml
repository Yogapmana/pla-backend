services:
  # FastAPI API Server
  api:
    build: .
    container_name: pla_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Di dalam container, localhost = container itu sendiri.
      # Harus pakai nama service docker, bukan localhost.
      DATABASE_URL: postgresql+asyncpg://pla_user:pla_password@postgres:5432/pla_db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Frontend dipakai dari vercel.app (cross-site) → butuh SameSite=None + Secure.
      # Explicit true, karena .env berisi localhost → auto-deteksi akan memilih false.
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "none"
    depends_on:
      - postgres
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: .
    container_name: pla_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pla_user:pla_password@postgres:5432/pla_db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      - postgres
      - redis
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Celery Beat (optional - for scheduled tasks)
  celery_beat:
    build: .
    container_name: pla_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pla_user:pla_password@postgres:5432/pla_db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  # Database
  postgres:
    image: postgres:16-alpine
    container_name: pla_postgres
    environment:
      - POSTGRES_USER=pla_user
      - POSTGRES_PASSWORD=pla_password
      - POSTGRES_DB=pla_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pla_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: pla_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
